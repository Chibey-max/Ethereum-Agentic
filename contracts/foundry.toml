[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[rpc_endpoints]
sepolia          = "https://rpc.ankr.com/eth_sepolia"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
arbitrum_one     = "https://arb1.arbitrum.io/rpc"
robinhood        = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
arbitrum_one     = { key = "${ARBISCAN_API_KEY}", url = "https://api.arbiscan.io/api" }
robinhood        = { key = "placeholder", url = "https://explorer.testnet.chain.robinhood.com/api/" }
